name: TALON CI & Scheduled Paper Evaluation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Daily paper-tick and reproducible backtest verification at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, Typecheck & Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Secret scan guard (verify no private keys or exchanges tokens tracked)
        run: |
          if git grep -iE "(PRIVATE_KEY|SECRET_KEY|API_SECRET)=['\"]?[A-Za-z0-9]{16,}" -- ':!.env.example' ':!tests/' ':!docs/'; then
            echo "Potential hardcoded secret detected!"
            exit 1
          fi

      - name: Lint with Ruff
        run: ruff check src tests

      - name: Type check with Mypy
        run: mypy src tests

      - name: Run Pytest with coverage (>80% required)
        run: pytest

  scheduled-paper-and-backtest:
    name: Reproducible Backtest & Paper-Tick Simulation
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install TALON
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Execute single-command reproducible backtest & walk-forward report
        env:
          TALON_MODE: paper
        run: |
          python -m talon.cli backtest --config configs/default.yaml --output-dir reports

      - name: Execute single-step paper trading tick
        env:
          TALON_MODE: paper
        run: |
          python -m talon.cli paper-tick --config configs/default.yaml

      - name: Upload backtest report & SVG charts
        uses: actions/upload-artifact@v4
        with:
          name: talon-backtest-reports
          path: |
            reports/backtest_report.md
            reports/metrics.json
            reports/equity_curve.svg
            reports/drawdown.svg
          retention-days: 30
